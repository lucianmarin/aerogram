server {
    listen 443 ssl http2;
    server_name mail.lucianmarin.com;
    access_log /home/lucian/logs/aero.log.gz combined gzip;
    ssl_certificate /etc/letsencrypt/live/mail.lucianmarin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.lucianmarin.com/privkey.pem;
    location /.well-known/acme-challenge {
        root /home/lucian;
    }
    location / {
        proxy_pass http://unix:/home/lucian/aerogram/aero.socket;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name mail.lucianmarin.com;
    return 301 https://mail.lucianmarin.com$request_uri;
}

